# Publishes the package to PyPI when a GitHub release is published in
# vocalstack/python-sdk (tag v<version>, the version in pyproject.toml,
# e.g. v1.0.0a0).  PyPI trusts this repository, this workflow and the
# `pypi` environment (trusted publishing), so there is no token.
#
# This file lives in the monorepo at sdks/python/.github/ and reaches
# python-sdk with the rest of the SDK (scripts/sdk_repos.sh); edit it there.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the release tag matches pyproject.toml
        if: github.event_name == 'release'
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match version $version (want v$version)"; exit 1; }
      - name: build + twine check
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
