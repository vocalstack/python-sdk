[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vocalstack"
version = "1.0.0a1"
description = "VocalStack speech API SDK (asyncio): one client grouped by resource, typed models from the API contract, realtime WebSocket streaming."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://vocalstack.com"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalstack"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "vocalstack/SKILL.md"

[tool.hatch.build.targets.sdist]
only-include = ["src/vocalstack", "LICENSE", "README.md", "SKILL.md", "skills", "pyproject.toml"]
