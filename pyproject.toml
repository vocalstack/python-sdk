[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocalstack"
version = "1.0.0a0"
description = "VocalStack speech API SDK (asyncio): one client grouped by resource, typed models from the API contract, realtime WebSocket streaming."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://vocalstack.com"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalstack"]

# The Agent Skill ships inside the package (site-packages/vocalstack/SKILL.md)
# so an agent can find it next to the code.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "vocalstack/SKILL.md"

# An explicit list: nothing else from the repository goes into the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src/vocalstack", "README.md", "SKILL.md", "skills", "pyproject.toml"]
